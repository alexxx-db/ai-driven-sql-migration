name: lakebridge
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.10.1,<3.14
  # System-level dependency required by pyodbc
  - unixodbc

  # Core pip dependencies installed from pyproject.toml
  - pip
  - pip:
      # Runtime dependencies
      - databricks-sdk~=0.85.0
      - sqlglot==28.5.0
      - databricks-labs-blueprint[yaml]>=0.12.0,<0.13.0
      - databricks-labs-lsql==0.16.0
      - cryptography>=44.0.2,<46.1.0
      - pyodbc>=5.2,<5.4
      - SQLAlchemy~=2.0.40
      - pygls~=2.0.0
      - duckdb>=1.2.2,<1.5.0
      - requests>=2.28.1,<3
      - pandas~=2.3.1
      - databricks-bb-analyzer~=0.3.0
      - databricks-switch-plugin~=0.1.7

      # Dev / test dependencies
      - hatchling
      - pytest~=8.4.2
      - pytest-cov~=7.0.0
      - pytest-asyncio~=1.2.0
      - pytest-xdist~=3.8.0
      - pytest-timeout~=2.4.0
      - coverage[toml]~=7.10.7
      - black~=25.9.0
      - ruff~=0.13.2
      - mypy~=1.18.2
      - pylint~=3.2.2
      - pylint-pytest==2.0.0a0
      - databricks-labs-pylint~=0.5.0
      - databricks-labs-pytester>=0.3.0
      - databricks-connect==15.1
      - numpy~=1.26.4
      - pandas-stubs~=2.3.0.250703
      - cattrs>=25.2.0
      - faker
      - types-requests>=2.28.1,<3
      - types-pyYAML~=6.0.12
      - types-pytz~=2025.2

      # Install the project itself in editable mode
      - -e .
